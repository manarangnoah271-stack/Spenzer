<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Note For You ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, and Caveat for handwriting -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        hand: ['"Caveat"', 'cursive'],
                    },
                    colors: {
                        blush: {
                            50: '#FFF8F9',
                            100: '#FFEFF2',
                            200: '#FFDFE6',
                            300: '#FFC2D1',
                            400: '#FF94AF',
                            500: '#F45D84',
                            600: '#E13966',
                        },
                        cream: {
                            50: '#FFFCF8',
                            100: '#FDF7EE',
                            200: '#F8ECDA',
                        },
                        gold: {
                            300: '#E8D19A',
                            400: '#D4AF37',
                            500: '#B89225',
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-soft': 'pulseSoft 2.5s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.04)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at top left, #FFF8F9 0%, #FDF7EE 50%, #FFEFF2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar for Letter */
        .letter-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .letter-scroll::-webkit-scrollbar-track {
            background: rgba(255, 223, 230, 0.3);
            border-radius: 10px;
        }
        .letter-scroll::-webkit-scrollbar-thumb {
            background: #FFC2D1;
            border-radius: 10px;
        }

        /* Envelope 3D & Flap Transitions */
        .envelope-wrapper {
            perspective: 1000px;
        }
        .envelope-flap {
            transform-origin: top;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s;
            clip-path: polygon(0 0, 100% 0, 50% 58%);
        }
        .envelope-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }
        .envelope-pocket-left {
            clip-path: polygon(0 0, 52% 52%, 0 100%);
        }
        .envelope-pocket-right {
            clip-path: polygon(100% 0, 48% 52%, 100% 100%);
        }
        .envelope-pocket-bottom {
            clip-path: polygon(0 100%, 50% 48%, 100% 100%);
        }

        /* Soundwave Visualizer Bars */
        .wave-bar {
            transition: height 0.15s ease;
        }
        .playing .wave-bar:nth-child(1) { animation: soundwave 0.9s ease-in-out infinite alternate; }
        .playing .wave-bar:nth-child(2) { animation: soundwave 0.6s ease-in-out infinite alternate 0.2s; }
        .playing .wave-bar:nth-child(3) { animation: soundwave 1.1s ease-in-out infinite alternate 0.4s; }
        .playing .wave-bar:nth-child(4) { animation: soundwave 0.7s ease-in-out infinite alternate 0.1s; }
        .playing .wave-bar:nth-child(5) { animation: soundwave 0.95s ease-in-out infinite alternate 0.3s; }
        .playing .wave-bar:nth-child(6) { animation: soundwave 0.65s ease-in-out infinite alternate 0.5s; }
        .playing .wave-bar:nth-child(7) { animation: soundwave 0.85s ease-in-out infinite alternate 0.15s; }

        @keyframes soundwave {
            0% { height: 6px; }
            100% { height: 28px; }
        }

        /* Floating Reaction Hearts */
        @keyframes floatUpHeart {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.6) rotate(0deg);
            }
            50% {
                opacity: 0.9;
                transform: translateY(-90px) scale(1.15) rotate(12deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.9) rotate(-15deg);
            }
        }
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            animation: floatUpHeart 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Vinyl Grooves */
        .vinyl-disc {
            background: repeating-radial-gradient(
                #1a1718,
                #1a1718 4px,
                #292426 5px,
                #1a1718 6px
            );
            box-shadow: 0 12px 30px rgba(225, 57, 102, 0.18), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .vinyl-paused {
            animation-play-state: paused !important;
        }

        /* Card Transition */
        .card-stage {
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(18px) scale(0.98);
            position: absolute;
            inset: 0;
        }
        .card-active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            position: relative;
        }
    </style>
</head>
<body class="font-sans text-stone-800 flex flex-col justify-between p-4 sm:p-6 relative">

    <!-- Subtle Ambient Background Petals / Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-24 -left-24 w-72 h-72 bg-blush-200/40 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-80 h-80 bg-gold-300/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 left-1/4 w-96 h-96 bg-blush-300/30 rounded-full blur-3xl"></div>
    </div>

    <!-- Top Header & Stepper Navigation -->
    <header class="relative z-20 w-full max-w-xl mx-auto flex items-center justify-between pt-1 pb-4">
        <!-- Recipient Badge (Click to quickly set or edit name) -->
        <button onclick="openCustomizeModal('recipient')" class="flex items-center gap-2 bg-white/80 hover:bg-white backdrop-blur-md px-3.5 py-1.5 rounded-full border border-blush-200/80 shadow-sm transition-all active:scale-95" title="Click to set recipient's name">
            <span class="text-blush-500 text-sm">♥</span>
            <span class="text-xs sm:text-sm font-medium text-stone-600">For <strong id="headerRecipient" class="text-stone-800 font-semibold border-b border-dashed border-blush-400">Your Name</strong></span>
        </button>

        <!-- Step Indicators -->
        <div class="flex items-center gap-2 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-blush-200/80 shadow-sm" role="tablist" aria-label="Love Cards Progress">
            <button onclick="goToCard(1)" id="stepDot1" class="w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center transition-all bg-blush-500 text-white shadow-sm" title="Card 1: Love Letter">1</button>
            <div class="w-4 h-0.5 bg-blush-200 rounded-full" id="stepLine1"></div>
            <button onclick="goToCard(2)" id="stepDot2" class="w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center transition-all bg-blush-100 text-blush-500 hover:bg-blush-200" title="Card 2: Our Song">2</button>
            <div class="w-4 h-0.5 bg-blush-200 rounded-full" id="stepLine2"></div>
            <button onclick="goToCard(3)" id="stepDot3" class="w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center transition-all bg-blush-100 text-blush-500 hover:bg-blush-200" title="Card 3: Forever">3</button>
        </div>

        <!-- Customize Studio Button -->
        <button onclick="openCustomizeModal()" class="flex items-center gap-1.5 bg-white/80 hover:bg-white backdrop-blur-md px-3 py-1.5 rounded-full border border-gold-300/60 text-stone-600 hover:text-gold-500 text-xs font-medium shadow-sm transition-all active:scale-95" title="Customize name, letter, and YouTube song">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-gold-400"></i>
            <span class="hidden sm:inline">Customize</span>
        </button>
    </header>

    <!-- Main Interactive Stage -->
    <main class="relative z-10 w-full max-w-lg mx-auto my-auto py-2">
        <div class="relative min-h-[520px] sm:min-h-[550px] flex items-center justify-center">

            <!-- ========================================== -->
            <!-- CARD 1: A LOVE LETTER FOR YOU              -->
            <!-- ========================================== -->
            <section id="card1" class="card-stage card-active w-full">
                <div class="bg-cream-50/90 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-blush-200/80 shadow-[0_20px_50px_rgba(244,93,132,0.12)] text-center relative overflow-hidden">
                    <!-- Decorative Corner Accent -->
                    <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-blush-100/70 to-transparent rounded-bl-full pointer-events-none"></div>

                    <span class="inline-block px-3 py-1 rounded-full bg-blush-100 text-blush-600 text-xs font-semibold tracking-wider uppercase mb-2">Chapter I</span>
                    <h1 class="font-serif text-3xl sm:text-4xl font-bold text-stone-800 mb-1">A Love Letter For You</h1>
                    <p id="envelopePrompt" class="text-xs sm:text-sm text-stone-500 mb-6">Tap the wax seal to open your letter</p>

                    <!-- Interactive Envelope Container -->
                    <div id="envelopeContainer" class="envelope-wrapper relative w-full max-w-sm mx-auto transition-all duration-500">
                        
                        <!-- Closed Envelope View -->
                        <div id="closedEnvelope" onclick="openEnvelope()" class="cursor-pointer group relative w-full h-56 sm:h-60 bg-gradient-to-br from-blush-100 to-blush-200 rounded-2xl shadow-md border border-blush-300/70 overflow-hidden transition-transform duration-300 hover:scale-[1.02] active:scale-[0.99]">
                            <!-- Envelope Interior Shadow -->
                            <div class="absolute inset-0 bg-blush-300/30"></div>
                            <!-- Left & Right Folds -->
                            <div class="envelope-pocket-left absolute inset-0 bg-blush-100/95 border-r border-blush-200"></div>
                            <div class="envelope-pocket-right absolute inset-0 bg-blush-100/95 border-l border-blush-200"></div>
                            <!-- Bottom Fold -->
                            <div class="envelope-pocket-bottom absolute inset-0 bg-gradient-to-t from-blush-200 to-blush-100 shadow-inner"></div>
                            <!-- Top Flap -->
                            <div class="envelope-flap absolute inset-0 bg-gradient-to-b from-blush-300/90 to-blush-200 z-10 shadow-md"></div>

                            <!-- Gold & Rose Wax Seal Button -->
                            <div class="absolute inset-0 z-20 flex flex-col items-center justify-center">
                                <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blush-500 to-blush-600 border-4 border-gold-300/80 shadow-lg flex items-center justify-center text-white group-hover:scale-110 transition-transform duration-300 animate-pulse-soft">
                                    <i data-lucide="heart" class="w-7 h-7 fill-current"></i>
                                </div>
                                <span class="mt-3 px-3 py-1 rounded-full bg-white/85 backdrop-blur-sm text-xs font-semibold text-blush-600 shadow-sm">Tap to Open</span>
                            </div>
                        </div>

                        <!-- Opened Letter Content (Hidden initially) -->
                        <div id="openedLetter" class="hidden opacity-0 transition-all duration-700 transform translate-y-4">
                            <div class="bg-white rounded-2xl p-5 sm:p-6 border border-gold-300/60 shadow-inner text-left relative">
                                <!-- Subtle lined paper aesthetic -->
                                <div class="flex items-center justify-between border-b border-blush-100 pb-2.5 mb-3">
                                    <span onclick="openCustomizeModal('recipient')" class="cursor-pointer font-hand text-2xl text-blush-600 font-bold hover:underline" id="letterSalutation" title="Click to edit recipient name">Dearest __________,</span>
                                    <button onclick="resetEnvelope()" class="text-xs text-stone-400 hover:text-blush-500 flex items-center gap-1 transition-colors" title="Fold envelope back">
                                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                                <div id="letterBodyContainer" class="letter-scroll max-h-48 sm:max-h-52 overflow-y-auto pr-1 text-stone-700 text-sm sm:text-base leading-relaxed space-y-3 font-normal">
                                    <p id="letterTextDisplay" class="whitespace-pre-line"></p>
                                </div>

                                <div class="mt-4 pt-2 border-t border-blush-100 flex items-center justify-between">
                                    <span class="font-hand text-xl text-stone-600" id="letterSignOff">Forever yours ❤️</span>
                                    <!-- Send a Heart Interactive Reaction -->
                                    <button onclick="triggerFloatingHearts(event)" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-blush-50 hover:bg-blush-100 text-blush-600 border border-blush-200 text-xs font-semibold transition-all active:scale-90 shadow-sm">
                                        <span class="text-sm">💖</span> Send a Heart
                                        <span id="heartCounterBadge" class="ml-0.5 px-1.5 py-0.2 bg-blush-500 text-white rounded-full text-[10px] hidden">0</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Footer -->
                    <div class="mt-6 flex items-center justify-between">
                        <span class="text-xs text-stone-400 italic" id="card1Hint">Open the envelope first ✨</span>
                        <button onclick="goToCard(2)" id="nextToCard2Btn" class="ml-auto inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-gradient-to-r from-blush-500 to-blush-600 hover:from-blush-600 hover:to-blush-600 text-white text-sm font-semibold shadow-md shadow-blush-500/25 transition-all hover:translate-x-0.5 active:scale-95">
                            <span>Our Song</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- CARD 2: OUR SONG (YOUTUBE + VINYL PLAYER)  -->
            <!-- ========================================== -->
            <section id="card2" class="card-stage card-hidden w-full">
                <div class="bg-cream-50/90 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-blush-200/80 shadow-[0_20px_50px_rgba(244,93,132,0.12)] text-center relative overflow-hidden">
                    <div class="flex items-center justify-center gap-2 mb-2">
                        <span class="inline-block px-3 py-1 rounded-full bg-gold-300/30 text-gold-500 text-xs font-semibold tracking-wider uppercase">Chapter II</span>
                        <span id="audio
